<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #ffffff;
            background-image: url('images/sky_background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            color: #333333;
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: transparent;
            box-shadow: none;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-left a {
            color: #ffffff;
            font-size: 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .navbar-left a:hover {
            color: #004182;
        }

        .navbar-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-signin {
            color: #ffffff;
            background: transparent;
            border: 2px solid #ffffff;
        }

        .btn-signin:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-getstarted {
            color: #000000;
            background: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-getstarted:hover {
            background: #f0f0f0;
            border-color: #f0f0f0;
        }

        /* Main Content */
        .hero {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            padding: 10px 10% 0px 10%;
            min-height: auto;
            box-sizing: border-box;
            gap: 50px;
            margin-top: 0px;
        }

        .hero-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hero-left h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.1;
            text-align: left;
            text-shadow: 0 4px 15px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .hero-content-wrapper {
            display: flex;
            flex-direction: column;
            width: fit-content;
        }

        .line-1 {
            font-size: 4rem; 
            color: #3868EE; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            gap: 12px;
        }

        .line-2 {
            font-size: 8rem; 
            color: #ffffff; 
            font-weight: 800; 
            display: block; 
            margin-top: 10px;
        }

        .unlock-pill {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
            padding: 8px 8px 8px 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            font-size: 1.4rem;
            font-weight: 500;
            color: #444;
            backdrop-filter: blur(5px);
            margin-top: 20px;
        }

        .unlock-btn {
            background: linear-gradient(135deg, #1A73E8, #0A66C2);
            color: white;
            border-radius: 50px;
            padding: 12px 28px;
            margin-left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1.2rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(10, 102, 194, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .unlock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(10, 102, 194, 0.4);
        }

        .features-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 8px 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            margin-top: 15px;
            margin-bottom: 15px;
            width: fit-content;
            box-sizing: border-box;
            gap: 20px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: linear-gradient(135deg, #f0f7ff, #d4e8ff);
            color: #0A66C2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            box-shadow: inset 1px 1px 3px rgba(255,255,255,0.9), 
                        inset -1px -1px 3px rgba(0,0,0,0.05),
                        1px 2px 5px rgba(0,0,0,0.1);
        }

        .feature-text {
            color: #333333;
            font-weight: 600;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .hero-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
        }

        .hero-right img.main-presenter {
            width: 320%; 
            max-width: none;
            height: auto;
            margin-top: 0px; 
            margin-bottom: 0px; 
            filter: drop-shadow(-10px 15px 30px rgba(0,0,0,0.25));
            position: absolute;
            bottom: 0;
            right: -120%;
            z-index: 10;
        }

        .floating-logo {
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.2));
            animation: float 6s ease-in-out infinite;
            mix-blend-mode: multiply;
        }
        
        .logo-inline {
            display: inline-block;
            vertical-align: middle;
            margin-left: 20px;
        }
        
        .logo-inline-1 { width: 70px; animation-delay: 0s; }
        .logo-inline-2 { width: 50px; animation-delay: 1.5s; }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(-5deg); }
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 60px 20px;
            }
            .hero-left {
                align-items: center;
                margin-bottom: 50px;
            }
            .hero-left h1 {
                text-align: center;
                white-space: normal;
            }
            .line-1 {
                font-size: 2.5rem;
                justify-content: center;
            }
            .line-2 {
                font-size: 5rem;
            }
            .hero-content-wrapper {
                width: 100%;
                align-items: center;
            }
            .features-bar {
                flex-direction: column;
                border-radius: 20px;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="navbar-left">
            <a href="home.html" title="Home"><i class="fa-solid fa-house"></i> Home</a>
        </div>
        <div class="navbar-right">
            <a href="https://www.linkedin.com/in/sagarmasand1/" target="_blank" class="btn btn-signin">Meet Founder</a>
            <a href="dashboard.html?tab=login" class="btn btn-signin">Sign In</a>
            <a href="dashboard.html?tab=signup" class="btn btn-getstarted">Start AI Now</a>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-left">
            <div class="hero-content-wrapper">
                <h1>
                    <span class="line-1">MY LinkedIn <i class="fab fa-linkedin" style="color: #0A66C2; font-size: 1.1em;"></i></span>
                    <span class="line-2">
                        AI Agent
                        <img src="linkedin_3d_transparent.png" class="floating-logo logo-inline logo-inline-1" alt="LinkedIn Logo">
                        <img src="linkedin_3d_transparent.png" class="floating-logo logo-inline logo-inline-2" alt="LinkedIn Logo">
                    </span>
                </h1>

                <div class="features-bar">
                    <a href="#features" class="btn btn-getstarted" style="padding: 6px 16px; border-radius: 20px; font-size: 0.95rem; text-decoration: none; margin-right: 10px;">Features</a>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fa-solid fa-briefcase"></i></div>
                        <span class="feature-text">500+ Relations</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fa-solid fa-paper-plane"></i></div>
                        <span class="feature-text">1k+ AI Messages</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fa-regular fa-calendar-check"></i></div>
                        <span class="feature-text">Daily AI Postings</span>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon"><i class="fa-solid fa-comment-dots"></i></div>
                        <span class="feature-text">1k+ AI Comments</span>
                    </div>
                </div>
            </div>
            
            <div class="unlock-pill">
                Full LinkedIn potential
                <div class="unlock-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" style="margin-right: 5px;">
                        <path d="M12 0C12 6.62742 17.3726 12 24 12C17.3726 12 12 17.3726 12 24C12 17.3726 6.62742 12 0 12C6.62742 12 12 6.62742 12 0Z"/>
                    </svg>
                    AI Unlock
                </div>
            </div>
        </div>
        
        <div class="hero-right">
            <img src="girl%20image-Photoroom.png" class="main-presenter" alt="AI Agent Presenter">
        </div>
    </div>

</body>
</html>
